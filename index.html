<title>かく — 써보는 JLPT 단어·한자</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --accent: #ea580c;
    --accent-soft: #fff2e8;
    --ok: #16a34a;  --ok-soft: #eefbf1;
    --no: #dc2626;  --no-soft: #fef2f2;
    --ink: #1c1917; --sub: #78716c; --dim: #a8a29e;
    --line: #e7e5e4; --bg: #faf9f7;
  }

  body {
    font-family: -apple-system, "Segoe UI", "Malgun Gothic",
                 "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
    background: var(--bg); color: var(--ink);
    display: flex; justify-content: center;
    padding: 28px 16px 64px; min-height: 100vh;
  }
  .app { width: 100%; max-width: 600px; }

  /* ── 헤더 ── */
  header { margin-bottom: 18px; display: flex; align-items: baseline; gap: 10px; }
  h1 { font-size: 21px; letter-spacing: -.02em; white-space: nowrap; }
  h1 span { color: var(--accent); }
  .tagline { font-size: 12px; color: var(--dim); }
  /* (모바일 규칙은 케스케이드 순서 때문에 스타일시트 맨 끝에 있음) */

  /* ── 공통 ── */
  .card {
    background: #fff; border: 1px solid var(--line);
    border-radius: 16px; padding: 24px;
    box-shadow: 0 1px 3px rgba(0,0,0,.04);
  }
  .card + .card { margin-top: 12px; }
  h2 { font-size: 14px; color: var(--sub); margin-bottom: 12px; font-weight: 600; }

  button {
    font-family: inherit; font-size: 15px; font-weight: 600;
    border: none; border-radius: 10px; cursor: pointer;
    padding: 13px 16px; background: var(--accent); color: #fff;
    transition: filter .15s;
  }
  button:hover { filter: brightness(1.08); }
  button.ghost {
    background: #fff; color: var(--sub); border: 1.5px solid var(--line);
  }
  button.ghost:hover { border-color: var(--accent); color: var(--accent); filter: none; }
  .row { display: flex; gap: 8px; margin-top: 16px; }
  .row button { flex: 1; }
  .row button.narrow { flex: 0 0 auto; }

  /* ── 선택 칩 ── */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    padding: 9px 14px; border: 1.5px solid var(--line); border-radius: 99px;
    background: #fff; font-size: 14px; cursor: pointer; color: var(--sub);
    font-weight: 500; transition: .15s;
  }
  .chip:hover { border-color: var(--accent); }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chip small { display: block; font-size: 10px; opacity: .8; font-weight: 400; }
  .chip-input {
    width: 84px; padding: 9px 10px; border: 1.5px solid var(--line); border-radius: 99px;
    background: #fff; font-size: 14px; font-family: inherit; color: var(--sub);
    text-align: center; outline: none; -moz-appearance: textfield;
  }
  .chip-input::-webkit-outer-spin-button, .chip-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .chip-input:focus { border-color: var(--accent); }
  .chip-input.on { border-color: var(--accent); color: var(--accent); font-weight: 700; }

  /* ── 대시보드 (S1) ── */
  .dash-top { display: flex; justify-content: space-between; align-items: baseline; font-weight: 700; font-size: 15px; }
  .goalbar { height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; margin: 12px 0 8px; }
  .goalbar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s; }
  .goalbar i.done { background: var(--ok); }
  .install-tip { position: relative; background: var(--accent-soft); border: 1px solid #fed7aa;
                 border-radius: 14px; padding: 14px 42px 14px 16px; margin-top: 12px;
                 font-size: 13px; color: var(--sub); line-height: 1.65; }
  .install-tip b.t { display: block; color: var(--ink); margin-bottom: 3px; font-size: 13.5px; }
  .install-tip #installX { position: absolute; top: 7px; right: 9px; background: none;
                           border: none; color: var(--dim); font-size: 13px; cursor: pointer; padding: 5px; }
  .btn-inst { background: var(--accent); color: #fff; border: none; border-radius: 9px;
              padding: 8px 15px; font-size: 13px; font-weight: 700; cursor: pointer; margin-top: 7px; }
  .stat-strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; }
  .stat-cell { background: var(--bg); border-radius: 10px; padding: 8px 2px; text-align: center; }
  .stat-cell b { display: block; font-size: 15px; letter-spacing: -0.3px; }
  .stat-cell span { font-size: 11px; color: var(--dim); }

  /* ── 통계 (S5) ── */
  .statbig { font-size: 44px; font-weight: 800; color: var(--accent); text-align: center; margin: 4px 0; }
  .bars { display: flex; gap: 6px; align-items: flex-end; height: 90px; margin: 10px 0 4px; }
  .bars .b { flex: 1; background: var(--accent-soft); border-radius: 6px 6px 0 0; min-height: 4px; }
  .bars .b.met { background: var(--accent); }
  .bars-labels { display: flex; gap: 6px; font-size: 10px; color: var(--dim); text-align: center; }
  .bars-labels span { flex: 1; }

  /* ── 레벨 진도 ── */
  .lv { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px dashed var(--line); }
  .lv:last-child { border-bottom: none; }
  .lv-name { width: 92px; font-weight: 600; font-size: 14px; flex: 0 0 auto; }
  .lv-name em { display: block; font-style: normal; font-size: 11px; color: var(--dim); font-weight: 400; }
  .lv-bar { flex: 1; height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; display: flex; }
  .lv-bar i { display: block; height: 100%; }
  .lv-bar .learned { background: var(--ok); }
  .lv-bar .learning { background: var(--accent); }
  .lv-num { font-size: 11px; color: var(--sub); width: 108px; text-align: right; flex: 0 0 auto; font-variant-numeric: tabular-nums; }
  .lv-num b { color: var(--accent); }

  /* ── 퀴즈 ── */
  .qbar { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; margin-bottom: 8px; }
  .qbar i { display: block; height: 100%; background: var(--accent); transition: width .3s; }
  .qmeta { display: flex; justify-content: space-between; font-size: 12px; color: var(--sub); margin-bottom: 14px; font-variant-numeric: tabular-nums; }
  .box-tag { font-size: 11px; color: var(--dim); }

  .qlabel { font-size: 12px; color: var(--sub); text-align: center; letter-spacing: .03em; }
  .qprompt { font-size: 38px; font-weight: 700; text-align: center; margin: 12px 0 4px; letter-spacing: -.01em; line-height: 1.25; }
  .qprompt.big { font-size: 68px; }
  .qhint { text-align: center; font-size: 13px; color: var(--sub); min-height: 19px; }
  .qhint b { color: var(--accent); }
  .qmeaning {
    display: none; width: fit-content; margin: 8px auto 0;
    font-size: 18px; font-weight: 800; color: var(--accent);
    background: var(--accent-soft); border-radius: 10px; padding: 5px 16px;
  }
  .qmeaning.show { display: block; }

  .kana-view {
    margin: 20px 0 12px; min-height: 74px;
    display: flex; align-items: center; justify-content: center;
    background: var(--accent-soft); border-radius: 12px;
    font-size: 38px; letter-spacing: .06em; color: var(--accent); font-weight: 600;
    transition: background .2s, color .2s;
  }
  .kana-view.empty { color: #d6d3d1; background: #fafaf9; font-size: 16px; font-weight: 400; letter-spacing: 0; }
  .kana-view.right { background: var(--ok-soft); color: var(--ok); }
  .kana-view.wrong { background: var(--no-soft); color: var(--no); }

  input[type=text] {
    width: 100%; padding: 14px 16px; font-size: 18px; font-family: inherit;
    border: 1.5px solid var(--line); border-radius: 10px; outline: none;
    text-align: center; letter-spacing: .05em; background: #fff;
  }
  input[type=text]:focus { border-color: var(--accent); }
  input[type=text]:disabled { background: #fafaf9; color: var(--sub); }

  .opts { display: grid; gap: 8px; margin: 20px 0 4px; }
  .opt {
    padding: 15px; border: 1.5px solid var(--line); border-radius: 10px;
    background: #fff; font-size: 17px; cursor: pointer; text-align: center;
    font-family: inherit; color: var(--ink); font-weight: 500; transition: .12s;
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); }
  .opt:disabled { cursor: default; }
  .opt.is-right { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); font-weight: 700; }
  .opt.is-wrong { background: var(--no-soft); border-color: var(--no); color: var(--no); }

  .feedback { margin-top: 14px; text-align: center; font-size: 15px; line-height: 1.75; min-height: 56px; }
  .verdict { font-weight: 700; }
  .feedback.right .verdict { color: var(--ok); }
  .feedback.wrong .verdict { color: var(--no); }
  .ans-kana { font-size: 22px; font-weight: 700; }
  .extra { color: var(--sub); font-size: 14px; }
  .speak {
    background: none; border: none; cursor: pointer; font-size: 19px;
    padding: 2px 6px; color: var(--accent); vertical-align: middle;
  }
  .speak:hover { filter: brightness(1.2); }
  .speak:disabled { opacity: .25; cursor: default; }

  /* ── 결과 ── */
  .done { text-align: center; }
  .done h2 { font-size: 24px; color: var(--ink); margin-bottom: 6px; }
  .score { font-size: 46px; font-weight: 800; color: var(--accent); margin: 10px 0 2px; }
  .missed { text-align: left; margin-top: 22px; border-top: 1px solid var(--line); padding-top: 16px; }
  .missed li {
    list-style: none; padding: 9px 0; border-bottom: 1px dashed var(--line);
    font-size: 15px; display: flex; justify-content: space-between; gap: 12px; align-items: center;
  }
  .missed li b { color: var(--accent); }

  /* ── 가져오기 ── */
  textarea {
    width: 100%; min-height: 180px; padding: 12px; font-family: ui-monospace, "Consolas", monospace;
    font-size: 13px; border: 1.5px solid var(--line); border-radius: 10px; outline: none; resize: vertical;
    line-height: 1.7;
  }
  textarea:focus { border-color: var(--accent); }
  .note { font-size: 12.5px; color: var(--sub); line-height: 1.75; margin-bottom: 12px; }
  .note code { background: var(--accent-soft); color: var(--accent); padding: 1px 5px; border-radius: 4px; }

  .foot { text-align: center; font-size: 11.5px; color: var(--dim); margin-top: 18px; line-height: 1.7; }
  kbd { background:#fff; border:1px solid var(--line); border-bottom-width:2px; border-radius:4px;
        padding:1px 5px; font-size:11px; font-family:inherit; }
  .warn { color: var(--no); }

  /* ── 한자 상세 (채점 후 단어 속 한자 분해) ── */
  .kd-btn {
    width: 100%; margin-top: 10px; padding: 10px;
    font-size: 13.5px; font-weight: 600;
    background: #fff; border: 1.5px dashed var(--line); color: var(--sub);
    border-radius: 10px; cursor: pointer;
  }
  .kd-btn:hover { border-color: var(--accent); color: var(--accent); }
  .kd-panel { margin-top: 8px; border: 1px solid var(--line); border-radius: 12px; background: #fff; text-align: left; }
  .kd-row { display: flex; gap: 14px; padding: 12px 14px; border-bottom: 1px dashed var(--line); align-items: center; }
  .kd-row:last-child { border-bottom: none; }
  .kd-ch { font-size: 42px; font-weight: 700; line-height: 1; flex: 0 0 auto; }
  .kd-info { font-size: 13.5px; line-height: 1.65; }

  /* ── 모바일 (맨 끝에 둬야 기본 규칙을 이김) ── */
  @media (max-width: 480px) {
    h1 { font-size: 17px; white-space: nowrap; }   /* 타이틀 한 줄 유지 */
    .tagline { display: none; }                     /* 부제 숨김 */
    /* 문제 화면 압축 — 키보드가 올라와도 입력칸까지 다 보이게 */
    body { padding: 12px 12px 40px; }
    header { margin-bottom: 10px; }
    .card { padding: 16px 14px; }
    .qprompt { font-size: 28px; margin: 8px 0 4px; }
    .qprompt.big { font-size: 50px; }
    .qmeaning { font-size: 16px; }
    .kana-view { min-height: 54px; font-size: 28px; margin: 12px 0 10px; }
    .feedback { min-height: 40px; margin-top: 10px; }
  }
</style>

<body>
<div class="app">
  <header>
    <h1>かく <span>— 써보는 JLPT 단어·한자</span></h1>
    <span class="tagline">눈으로 넘기지 말고 직접 쓰기</span>
  </header>
  <main id="screen"></main>
  <p class="foot" id="foot"></p>
</div>

<script src="data.js"></script>
<script src="data_jlpt.js?v=4"></script>
<script src="data_kanji.js?v=4"></script>
<script>
/* 하단 안내문의 현재 모드. 발음 초기화가 화면 코드보다 먼저 돌기 때문에
   TDZ(선언 전 접근) 에러를 피하려고 var로 맨 위에 둡니다. */
var footMode = 'home';

/* ============================================================
   1. 로마자 → 히라가나 변환기
   ============================================================ */
const KANA = {
  kya:'きゃ', kyu:'きゅ', kyo:'きょ',  gya:'ぎゃ', gyu:'ぎゅ', gyo:'ぎょ',
  sha:'しゃ', shu:'しゅ', sho:'しょ',  sya:'しゃ', syu:'しゅ', syo:'しょ',
  cha:'ちゃ', chu:'ちゅ', cho:'ちょ',  tya:'ちゃ', tyu:'ちゅ', tyo:'ちょ',
  nya:'にゃ', nyu:'にゅ', nyo:'にょ',
  hya:'ひゃ', hyu:'ひゅ', hyo:'ひょ',  bya:'びゃ', byu:'びゅ', byo:'びょ',
  pya:'ぴゃ', pyu:'ぴゅ', pyo:'ぴょ',
  mya:'みゃ', myu:'みゅ', myo:'みょ',
  rya:'りゃ', ryu:'りゅ', ryo:'りょ',
  jya:'じゃ', jyu:'じゅ', jyo:'じょ',  zya:'じゃ', zyu:'じゅ', zyo:'じょ',
  shi:'し', chi:'ち', tsu:'つ', tu:'つ', si:'し', ti:'ち', hu:'ふ', fu:'ふ',
  ji:'じ', zi:'じ', ja:'じゃ', ju:'じゅ', jo:'じょ', di:'ぢ', du:'づ',
  a:'あ', i:'い', u:'う', e:'え', o:'お',
  ka:'か', ki:'き', ku:'く', ke:'け', ko:'こ',
  sa:'さ', su:'す', se:'せ', so:'そ',
  ta:'た', te:'て', to:'と',
  na:'な', ni:'に', nu:'ぬ', ne:'ね', no:'の',
  ha:'は', hi:'ひ', he:'へ', ho:'ほ',
  ma:'ま', mi:'み', mu:'む', me:'め', mo:'も',
  ya:'や', yu:'ゆ', yo:'よ',
  ra:'ら', ri:'り', ru:'る', re:'れ', ro:'ろ',
  wa:'わ', wo:'を',
  ga:'が', gi:'ぎ', gu:'ぐ', ge:'げ', go:'ご',
  za:'ざ', zu:'ず', ze:'ぜ', zo:'ぞ',
  da:'だ', de:'で', do:'ど',
  ba:'ば', bi:'び', bu:'ぶ', be:'べ', bo:'ぼ',
  pa:'ぱ', pi:'ぴ', pu:'ぷ', pe:'ぺ', po:'ぽ',
  xa:'ぁ', xi:'ぃ', xu:'ぅ', xe:'ぇ', xo:'ぉ', xtsu:'っ', xtu:'っ',
  '-':'ー'
};

/** @param final true면 끝에 남은 n을 ん으로 확정 (채점할 때만) */
function toKana(raw, final = false) {
  const s = String(raw).toLowerCase().replace(/[^a-z぀-ゟ゠-ヿ\-]/g, '');
  let out = '', i = 0;
  while (i < s.length) {
    const c = s[i];
    if (c > '぀') { out += c; i++; continue; }                 // 이미 카나면 통과
    if (s[i+1] === c && !'aeioun'.includes(c)) { out += 'っ'; i++; continue; }  // 촉음
    if (c === 'n') {
      if (s[i+1] === 'n') { out += 'ん'; i += 2; continue; }
      if (i+1 >= s.length) { if (final) { out += 'ん'; i++; continue; } }
      else if (!'aeiouy'.includes(s[i+1])) { out += 'ん'; i++; continue; }
    }
    let hit = false;
    for (let len = 4; len >= 1; len--) {
      const chunk = s.substr(i, len);
      if (KANA[chunk]) { out += KANA[chunk]; i += len; hit = true; break; }
    }
    if (!hit) { out += c; i++; }
  }
  return out;
}

/* ============================================================
   2. 저장소 (localStorage) — 새로고침해도 남습니다
   ============================================================ */
const KEY = 'kaku.v2';
const DEFAULTS = {
  progress: {},                  // itemId → { box, due, r, w }
  custom:   {},                  // "N5|word" → [ {kana,kanji,ko}, ... ]
  settings: { level:'N5', deck:'word', mode:'mix', size:20, speak:true,
              targetLevel:'N3', examDate:null, dailyGoal:10, purpose:null, todayDeck:'word',
              todayMode:'type' },   // 오늘의 학습 출제 방식: type(타이핑, 기본) | choice(뜻 고르기) | mix(랜덤)
  stats:    { daily:{}, streak:0, lastMet:null, settledIds:{} },
  onboarded: false,
  anonId: null,           // 익명 인스턴스 ID (개인정보 아님, 리텐션 측정용)
  firstDay: null,         // 첫 사용일 (YYYY-MM-DD) — D1/D7/D30 리텐션 계산 기준
  ret: {},                // 이미 보낸 리텐션 이벤트 표시 (d1/d7/d30, 중복 전송 방지)
  lastDailyVisit: null,   // visit_daily(DAU)를 마지막으로 보낸 날 — 하루 1회만 전송
  channel: null,          // 유입 채널 (?from=... 첫 방문 값만 보관, 이후 덮어쓰지 않음)
  installHidden: false,   // 홈 화면 추가 안내를 사용자가 닫았는지
  installShown: false     // 안내를 한 번이라도 보여줬는지 (노출 이벤트 중복 방지)
};

let S = load();
function load() {
  try {
    const raw = JSON.parse(localStorage.getItem(KEY));
    if (!raw) return structuredClone(DEFAULTS);
    const s = { ...DEFAULTS, ...raw,
      settings: { ...DEFAULTS.settings, ...raw.settings },
      ret: (raw.ret) || {},
      stats: { ...DEFAULTS.stats, ...(raw.stats || {}),
               daily: (raw.stats && raw.stats.daily) || {},
               settledIds: (raw.stats && raw.stats.settledIds) || {} } };
    // 기존 사용자 마이그레이션: 학습 기록이 있으면 온보딩 생략, 이미 익힌 단어는 정착 처리
    if (raw.onboarded === undefined && Object.keys(s.progress).length) {
      s.onboarded = true;
      for (const id in s.progress) if (s.progress[id].box >= 4) s.stats.settledIds[id] = 1;
    }
    return s;
  } catch { return structuredClone(DEFAULTS); }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { console.warn('저장 실패', e); }
}

/* ============================================================
   3. SRS — 라이트너 상자 방식
   맞히면 상자가 한 칸 올라가고 다음 복습이 그만큼 미뤄집니다.
   틀리면 한 칸 내려가고 오늘 다시 나옵니다.
   ============================================================ */
const DAY = 86400000;
const INTERVALS = [0, 1, 3, 7, 16, 35];   // 상자 0~5 → 며칠 뒤 복습
const MAXBOX = 5;

const idOf  = (lv, dk, it) => `${lv}|${dk}|${dk === 'word' ? it.kana + '·' + it.kanji : it.ch}`;
const recOf = id => S.progress[id] || null;

function applyResult(id, correct) {
  const r = S.progress[id] || { box: 0, due: 0, r: 0, w: 0 };
  if (correct) { r.box = Math.min(MAXBOX, r.box + 1); r.r++; }
  else         { r.box = Math.max(0, r.box - 1);      r.w++; }
  r.due = Date.now() + INTERVALS[r.box] * DAY;
  S.progress[id] = r;
  let settled = false;   // 상자4 첫 도달 = "정착" (North Star). 재도달은 중복 집계 안 함
  if (r.box >= 4 && !S.stats.settledIds[id]) { S.stats.settledIds[id] = 1; settled = true; }
  save();
  return settled;
}

/* ── 일일 집계 · streak (규칙: 그날 목표 문항 수를 채워야 달성) ── */
const dstr = d => { const t = d || new Date();
  return t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0'); };
const yesterdayStr = () => { const t = new Date(); t.setDate(t.getDate() - 1); return dstr(t); };
const todayStat = () => S.stats.daily[dstr()] || { n: 0, c: 0, s: 0 };

function recordAnswer(correct, settled) {
  const k = dstr();   // 자정 걸친 세션: 채점 시점 날짜로 집계
  const d = S.stats.daily[k] || (S.stats.daily[k] = { n: 0, c: 0, s: 0 });
  d.n++; if (correct) d.c++; if (settled) d.s++;
  track(correct ? 'answer_o' : 'answer_x');   // 일일 학습량·정답률 (날짜별 총합으로 집계)
  if (settled) track('word_settled', true);          // ⭐ North Star: 단어가 상자4(정착)에 첫 도달
  // 오늘 목표를 채우는 순간 streak 판정 (그날의 목표값 기준, 소급 없음)
  if (d.n >= S.settings.dailyGoal && S.stats.lastMet !== k) {
    S.stats.streak = (S.stats.lastMet === yesterdayStr()) ? S.stats.streak + 1 : 1;
    S.stats.lastMet = k;
    track('goal_met');
    if ([3, 7, 30].includes(S.stats.streak)) track('streak_' + S.stats.streak);   // 습관 형성 마일스톤
  }
  save();
}
function streakNow() {
  // 오늘 이미 달성했거나, 어제까지 달성한 상태(오늘은 아직 진행 중)면 살아 있음
  if (S.stats.lastMet === dstr() || S.stats.lastMet === yesterdayStr()) return S.stats.streak;
  return 0;   // 하루라도 목표 미달로 지나가면 끊김
}

/* ── 애널리틱스 (익명·경량) ──────────────────────────────
   GoatCounter(무료) 가입 후 아래 상수에 사이트 주소를 넣으면 수집이 시작됩니다.
   예: const ANALYTICS = 'https://kaku.goatcounter.com/count';
   비어 있으면 아무것도 전송하지 않습니다(no-op).
   이벤트는 경로로 기록: /이벤트명/세그먼트(목적-레벨-시험일유무)
   → GoatCounter 대시보드에서 경로별로 "취업×N2×시험일있음" 같은 분석 가능 */
const ANALYTICS = 'https://kaku.goatcounter.com/count';
/* 피드백 폼(구글폼 등) 주소 — 비어 있으면 설정 화면에 버튼이 표시되지 않음 */
const FEEDBACK_URL = 'https://forms.gle/jidwCiLMXNxNUiLR7';
function track(event, withChannel) {
  try {
    if (!ANALYTICS) return;
    const seg = `${S.settings.purpose || 'none'}-${S.settings.targetLevel}-${S.settings.examDate ? 'exam' : 'noexam'}`;
    /* 유입 채널은 경로 종류가 폭증하지 않도록 핵심 지표(유입·온보딩 완료·리텐션·정착)에만 붙인다 */
    const ch = withChannel ? '/' + (S.channel || 'direct') : '';
    new Image().src = ANALYTICS
      + '?p=' + encodeURIComponent('/' + event + '/' + seg + ch)
      + '&e=true&rnd=' + Date.now() + '_' + (S.anonId || '');
  } catch (e) { /* 수집 실패는 조용히 무시 */ }
}

/* ============================================================
   4. 덱 만들기
   ============================================================ */
/* 시드(한국어 뜻) + JLPT 전체 목록(영어 뜻)을 병합합니다.
   같은 항목이 양쪽에 있으면 한국어 시드를 우선합니다. */
const POOL_CACHE = {};
function basePoolOf(level, deck) {
  const key = level + '|' + deck;
  if (POOL_CACHE[key]) return POOL_CACHE[key];
  let merged;
  if (deck === 'kanji') {
    const seed = DATA[level].kanji;
    const seen = new Set(seed.map(k => k.ch));
    const full = (typeof KANJI_FULL !== 'undefined' && KANJI_FULL[level]) || [];
    merged = [...seed, ...full.filter(k => !seen.has(k.ch))];
  } else {
    const seed = DATA[level].words;
    const seen = new Set(seed.map(w => w.kana + '|' + w.kanji));
    const full = (typeof JLPT_FULL !== 'undefined' && JLPT_FULL[level]) || [];
    merged = [...seed, ...full.filter(w => !seen.has(w.kana + '|' + w.kanji))];
  }
  return POOL_CACHE[key] = merged;
}
function poolOf(level, deck) {
  const extra = S.custom[`${level}|${deck}`] || [];
  return [...basePoolOf(level, deck), ...extra];
}

function statsOf(level, deck) {
  const pool = poolOf(level, deck);
  const now = Date.now();
  let fresh = 0, learning = 0, learned = 0, due = 0;
  for (const it of pool) {
    const r = recOf(idOf(level, deck, it));
    if (!r) { fresh++; continue; }
    if (r.box >= 4) learned++; else learning++;
    if (r.due <= now) due++;
  }
  return { total: pool.length, fresh, learning, learned, due };
}

/** 복습 예정 → 처음 보는 것 → 나머지 순으로 세션을 채웁니다 */
function buildSession(level, deck, size) {
  const pool = poolOf(level, deck);
  const now = Date.now();
  const tagged = pool.map(it => {
    const id = idOf(level, deck, it);
    const r = recOf(id);
    return { it, id, lv: level, box: r ? r.box : 0, due: r ? r.due : null, isNew: !r };
  });
  const dueList  = tagged.filter(t => !t.isNew && t.due <= now).sort((a, b) => a.due - b.due);
  const newList  = shuffle(tagged.filter(t => t.isNew));
  const restList = shuffle(tagged.filter(t => !t.isNew && t.due > now));
  return [...dueList, ...newList, ...restList].slice(0, size);
}

function shuffle(a) {
  a = [...a];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ── 한자 상세: 단어 속 한자를 분해해 훈음·음독·훈독·예시를 보여줌 (전 레벨 한자 데이터 재활용) ── */
let KANJI_INDEX = null;
function kanjiInfo(ch) {
  if (!KANJI_INDEX) {
    KANJI_INDEX = {};
    for (const lv of LEVELS)
      for (const k of poolOf(lv, 'kanji'))
        if (!KANJI_INDEX[k.ch]) KANJI_INDEX[k.ch] = { ...k, lv };
  }
  return KANJI_INDEX[ch];
}

/* ── 오답 노트: 틀린 적 있고(w>0) 아직 못 익힌(box<4) 항목.
      상자 4에 도달하면 자동으로 노트에서 빠집니다(졸업). ── */
function collectMistakes(deck) {
  const list = [];
  for (const lv of LEVELS) {
    for (const it of poolOf(lv, deck)) {
      const id = idOf(lv, deck, it);
      const r = recOf(id);
      if (r && r.w > 0 && r.box < 4) {
        list.push({ it, id, lv, box: r.box, due: r.due, isNew: false, w: r.w, r: r.r });
      }
    }
  }
  // 많이 틀린 것 → 상자 낮은 것 순
  return list.sort((a, b) => b.w - a.w || a.box - b.box);
}

/* ============================================================
   5. 발음 듣기 (Web Speech API — 설치할 것 없음)
   ============================================================ */
let jaVoice = null, speechReady = false;
function loadVoices() {
  if (!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices();
  jaVoice = vs.find(v => v.lang && v.lang.toLowerCase().startsWith('ja')) || null;
  speechReady = vs.length > 0;
  paintFoot();
}
if ('speechSynthesis' in window) {
  speechSynthesis.onvoiceschanged = loadVoices;
  loadVoices();
}
function canSpeak() { return 'speechSynthesis' in window && !!jaVoice; }
function speak(text) {
  if (!canSpeak() || !text) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ja-JP'; u.voice = jaVoice; u.rate = 0.85;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

/* ── 홈 화면 추가(설치) 안내 ─────────────────────────────
   iOS 사파리는 설치 버튼을 제공하지 않아 안내가 없으면 설치 자체를 모른다.
   크롬 계열은 beforeinstallprompt로 진짜 설치창을 띄울 수 있다.
   이미 설치했거나(PWA 실행) 사용자가 닫았으면 다시 보여주지 않는다. */
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); deferredPrompt = e;
  if (document.getElementById('todayBtn')) renderHome();   // 홈이 떠 있으면 버튼을 반영해 다시 그림
});
const isIOSDevice = () => /iphone|ipad|ipod/i.test(navigator.userAgent)
  || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
function installKind() {
  if (isPWA || S.installHidden) return null;   // 이미 앱으로 쓰는 중이거나 닫음
  if (deferredPrompt) return 'button';         // 크롬 계열: 설치 버튼
  if (isIOSDevice()) return 'ios';             // 사파리: 수동 안내
  return null;                                 // 데스크톱 등은 표시하지 않음
}
function installTipHTML() {
  const k = installKind();
  if (!k) return '';
  /* iOS는 사파리와 홈 화면 앱의 저장 공간이 분리되어 학습 기록이 넘어가지 않는다(2026-08-14 실기기 확인).
     그래서 "공부한 뒤 추가"가 아니라 "추가하고 시작"으로 유도한다. 안드로이드는 기록이 공유되므로 해당 없음 */
  return `<div class="install-tip" id="installTip">
      <button id="installX" title="닫기">✕</button>
      ${k === 'button'
        ? '<b class="t">📲 홈 화면에 추가하면 매일 한 번에 열려요</b>'
          + '<button class="btn-inst" id="installBtn">홈 화면에 추가</button>'
        : '<b class="t">📲 먼저 홈 화면에 추가하고 시작하세요</b>'
          + '사파리 하단 <b>점 3개(⋯)</b> → <b>공유</b> → <b>더보기</b> → <b>홈 화면에 추가</b> 순서로 누르면 돼요.'
          + '<br>아이폰은 <b>브라우저와 앱의 학습 기록이 따로 저장</b>되니, 추가한 앱으로 공부해야 기록이 한곳에 쌓여요.'
          + '<br><span style="color:var(--dim);font-size:12px">이미 여기서 공부하셨다면 ⚙️ 설정 → 내보내기 → 추가한 앱에서 가져오기</span>'}
    </div>`;
}
function wireInstallTip() {
  const tip = document.getElementById('installTip');
  if (!tip) return;
  if (!S.installShown) { S.installShown = true; save(); track('install_hint_shown'); }
  document.getElementById('installX').onclick = () => {
    S.installHidden = true; save(); track('install_dismiss'); tip.remove();
  };
  const b = document.getElementById('installBtn');
  if (b) b.onclick = async () => {
    track('install_click');
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    const r = await deferredPrompt.userChoice.catch(() => null);
    deferredPrompt = null;
    if (r && r.outcome === 'accepted') { track('install_done'); S.installHidden = true; save(); tip.remove(); }
  };
}

/* ---------- 통계 (S5) ---------- */
function renderStats() {
  track('stats_open');   // 기능 발견율
  const settled = Object.keys(S.stats.settledIds).length;
  const days = [];
  for (let i = 6; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); days.push(dstr(d)); }
  const vals = days.map(k => S.stats.daily[k] || { n: 0, c: 0, s: 0 });
  const max = Math.max(S.settings.dailyGoal, ...vals.map(v => v.n), 1);
  const weekSettled = vals.reduce((a, v) => a + (v.s || 0), 0);
  const weekN = vals.reduce((a, v) => a + v.n, 0);

  screen.innerHTML = `
    <div class="card">
      <h2>📊 통계</h2>
      <p class="extra" style="text-align:center;margin-top:8px">지금까지 정착한 단어·한자 <span class="box-tag">상자4 도달</span></p>
      <p class="statbig">${settled}<span style="font-size:16px;color:var(--dim)"> 개</span></p>
      <p class="extra" style="text-align:center">최근 7일 — 정착 <b>${weekSettled}</b>개 · 학습 ${weekN}문항 · 🔥 ${streakNow()}일째</p>

      <h2 style="margin-top:22px">최근 7일 학습량 <span class="box-tag">주황=목표 달성일 · 목표 ${S.settings.dailyGoal}문항</span></h2>
      <div class="bars">${vals.map(v =>
        `<div class="b ${v.n >= S.settings.dailyGoal ? 'met' : ''}" style="height:${Math.max(4, v.n / max * 100)}%" title="${v.n}문항"></div>`).join('')}
      </div>
      <div class="bars-labels">${days.map(k => `<span>${+k.slice(8)}일</span>`).join('')}</div>

      <h2 style="margin-top:22px">레벨별 익힘 (단어)</h2>
      ${LEVELS.map(lv => { const s = statsOf(lv, 'word');
        return `<div class="lv"><span class="lv-name">${lv}</span>
          <div class="lv-bar"><i class="learned" style="width:${s.total ? s.learned / s.total * 100 : 0}%"></i><i class="learning" style="width:${s.total ? s.learning / s.total * 100 : 0}%"></i></div>
          <div class="lv-num">익힘 ${s.learned} / ${s.total}</div></div>`; }).join('')}

      <div class="row"><button class="ghost" id="backBtn3">← 홈</button></div>
    </div>`;
  document.getElementById('backBtn3').onclick = renderHome;
  paintFoot('home');
}

/* ---------- 설정 (S6) ---------- */

  screen.querySelectorAll('[data-tlv]').forEach(b =>

  screen.querySelectorAll('[data-tmode]').forEach(b =>

      S.settings.todayMode = b.dataset.tmode; save();

  gc.onchange = () => {

    const nv = Math.min(500, n);

    a.download = 'kaku-backup-' + dstr() + '.json';
    a.click(); URL.revokeObjectURL(a.href);

    if (confirm('학습 기록(정답·오답·복습 일정·통계)을 모두 지웁니다. 가져온 단어는 그대로 남습니다. 계속할까요?')) {

  document.getElementById('backBtn4').onclick = renderHome;

}

/* ---------- 온보딩 (S0) — 첫 방문 4스텝 ---------- */
/* 퍼널 측정: 각 스텝 도달을 1회씩만 기록 (재렌더 중복 방지)
   → GoatCounter에서 onboard_step1~4 → onboard_session → onboard_done 이탈률 확인 */
const obTracked = {};
function obTrack(step) {
  if (!obTracked[step]) { obTracked[step] = 1; track('onboard_step' + step); }
}

function renderOnboarding(step) {
  step = step || 1;
  obTrack(step);
  // 레벨 화면(3단계)까지 왔으면 온보딩 완료로 확정 —
  // 시험일을 입력하지 않거나 어느 단계에서 앱을 닫아도 온보딩이 반복되지 않음
  if (step >= 3 && !S.onboarded) { S.onboarded = true; save(); }
  if (step === 1) {
    screen.innerHTML = `
      <div class="card" style="text-align:center">
        <p class="qlabel" style="margin-top:4px">かく에 오신 걸 환영해요</p>
        <p class="qprompt" style="font-size:23px;line-height:1.5">보고 넘기면 잊어버립니다.<br><span style="color:var(--accent)">직접 써야</span> 외워집니다.</p>
        <div class="kana-view" style="font-size:26px;min-height:60px">mizu → みず</div>
        <p class="extra" style="margin-top:12px">
          로마자로 치면 히라가나가 됩니다.<br>
          JLPT 단어 8,110개 · 한자 2,212자<br>
          가입 없음 · 기록은 이 기기에 저장
        </p>
        <div class="row"><button id="ob1">시작하기</button></div>
      </div>`;
    document.getElementById('ob1').onclick = () => renderOnboarding(2);
  } else if (step === 2) {
    // 학습 목적 — 익명 세그먼트 질문 (탭 한 번, 건너뛰기 가능)
    const opts = [
      ['job',    '💼 취업·이직 준비'],
      ['exam',   '📝 JLPT 점수가 필요해요 (졸업·승진·스펙)'],
      ['abroad', '✈️ 유학·워킹홀리데이'],
      ['hobby',  '🎮 취미·덕질 (애니·게임·드라마)'],
      ['travel', '🧳 여행에서 쓰고 싶어요']
    ];
    screen.innerHTML = `
      <div class="card">
        <h2>일본어, 왜 공부하세요? <span class="box-tag">가장 가까운 하나만</span></h2>
        ${opts.map(([k, l]) =>
          `<div class="row" style="margin-top:8px"><button class="ghost" style="text-align:left" data-purpose="${k}">${l}</button></div>`).join('')}
        <p class="note" style="margin-top:12px;text-align:center">
          <a href="#" id="obSkipP" style="color:var(--dim)">건너뛰기</a>
        </p>
      </div>`;
    screen.querySelectorAll('[data-purpose]').forEach(b => b.onclick = () => {
      S.settings.purpose = b.dataset.purpose; save(); renderOnboarding(3);
    });
    document.getElementById('obSkipP').onclick = e => { e.preventDefault(); renderOnboarding(3); };
  } else if (step === 3) {
    screen.innerHTML = `
      <div class="card">
        <h2>목표 레벨을 골라주세요 <span class="box-tag">나중에 설정에서 변경 가능</span></h2>
        <div class="chips">${LEVELS.map(lv =>
          `<button class="chip ${S.settings.targetLevel === lv ? 'on' : ''}" data-oblv="${lv}">${lv}<small>${DATA[lv].label.split('· ')[1]}</small></button>`).join('')}
        </div>
        <div class="row"><button id="ob2">다음</button></div>
      </div>`;
    screen.querySelectorAll('[data-oblv]').forEach(b => b.onclick = () => {
      S.settings.targetLevel = b.dataset.oblv; S.settings.level = b.dataset.oblv; save(); renderOnboarding(3);
    });
    document.getElementById('ob2').onclick = () => renderOnboarding(4);
  } else {
    screen.innerHTML = `
      <div class="card">
        <h2>JLPT 시험일이 있나요? <span class="box-tag">선택</span></h2>
        <p class="note">등록하면 홈에 D-day가 표시돼요. 일일 목표는 <b>10문항</b>으로 시작합니다 (설정에서 변경 가능).</p>
        <input type="date" id="obDate" class="chip-input" style="width:100%;border-radius:10px;text-align:center">
        <div class="row">
          <button id="ob3">첫 학습 시작 (5문항) →</button>
          <button class="ghost narrow" id="obSkip">건너뛰기</button>
        </div>
      </div>`;
    document.getElementById('ob3').onclick = () => {
      const v = document.getElementById('obDate').value;
      if (v) { S.settings.examDate = v; track('exam_date_set'); }
      save(); startOnboardSession();
    };
    document.getElementById('obSkip').onclick = () => { save(); startOnboardSession(); };
  }
  paintFoot('onboard');
}

/* ---------- 세션 ---------- */
let queue, sessionLen, right, wrong, missed, cur, curKind, checked;
let sessionMode = 'normal';   // 'normal' | 'mistake' | 'today' | 'onboard'
let sessionDeck = 'word', sessionLevel = 'N5';

function startSession() {
  const { level, deck, size } = S.settings;
  sessionMode = 'normal'; sessionDeck = deck; sessionLevel = level;
  queue = buildSession(level, deck, size);
  if (!queue.length) { alert('학습할 항목이 없어요.'); return; }
  sessionLen = queue.length;
  right = 0; wrong = 0; missed = [];
  track('session_free');
  nextQ();
}

function startMistakeSession() {
  const mistakes = collectMistakes(S.settings.deck);
  if (!mistakes.length) { alert('오답 노트가 비어 있어요. 전부 졸업했습니다 👏'); renderHome(); return; }
  sessionMode = 'mistake'; sessionDeck = S.settings.deck; sessionLevel = S.settings.level;
  queue = mistakes.slice(0, S.settings.size);
  sessionLen = queue.length;
  right = 0; wrong = 0; missed = [];
  track('session_mistake');
  nextQ();
}

/* 오늘의 학습(S2): 목표 레벨 단어 덱에서 만기 복습 → 새 단어 순으로
   오늘 목표까지 남은 문항 수만큼 자동 구성 */
function startTodaySession() {
  const lvl = S.settings.targetLevel, goal = S.settings.dailyGoal;
  const deck = S.settings.todayDeck || 'word';   // 대시보드에서 고른 덱 (기억됨)
  const remain = goal - todayStat().n;
  const size = Math.max(5, remain > 0 ? remain : goal);   // 목표를 채웠으면 한 목표만큼 더
  sessionMode = 'today'; sessionDeck = deck; sessionLevel = lvl;
  queue = buildSession(lvl, deck, size);
  if (!queue.length) { alert('학습할 항목이 없어요.'); renderHome(); return; }
  sessionLen = queue.length;
  right = 0; wrong = 0; missed = [];
  track('session_today_' + deck);   // 덱 구분 → 한자 토글 사용률 측정
  nextQ();
}

/* 온보딩 첫 세션(S0): 목표 레벨의 쉬운 단어 5개, 타이핑 고정 */
function startOnboardSession() {
  const lvl = S.settings.targetLevel;
  // 온보딩 완료 도장은 여기서 — 첫 세션을 중간에 그만두거나 앱을 닫아도
  // 다음에 온보딩이 다시 나오지 않게 (레벨·시험일 입력이 끝났으면 온보딩은 끝)
  S.onboarded = true; save();
  track('onboard_session');   // 퍼널: 첫 세션 진입
  sessionMode = 'onboard'; sessionDeck = 'word'; sessionLevel = lvl;
  queue = basePoolOf(lvl, 'word').slice(0, 5).map(it =>
    ({ it, id: idOf(lvl, 'word', it), lv: lvl, box: 0, due: null, isNew: true }));
  sessionLen = queue.length;
  right = 0; wrong = 0; missed = [];
  nextQ();
}

function pickKind(deck, box) {
  let m;
  if (sessionMode === 'today') {
    // 오늘의 학습: 설정의 출제 방식을 따름 (한자 덱은 타이핑이 없으므로 자동 선택)
    const tm = S.settings.todayMode || 'type';
    if (deck === 'word') {
      if (tm === 'type')   return 'kanji2kana';                                  // 타이핑 (기본)
      if (tm === 'choice') return 'kana2ko';                                     // 뜻 고르기 (회독)
      return Math.random() < 0.5 ? 'kanji2kana' : 'kana2ko';                     // 랜덤 = 회독+타이핑 50:50
    }
    m = 'mix';
  } else m = S.settings.mode;
  if (m !== 'mix') return m;
  if (deck === 'word')
    return box < 1 ? 'kana2ko'       // 자유 학습 '섞어서': 첫 만남만 고르기, 이후 타이핑
         : 'kanji2kana';
  return Math.random() < 0.5 ? 'kanji2ko' : 'ko2kanji';
}

function nextQ() {
  checked = false;
  cur = queue.shift();
  if (!cur) return renderDone();
  curKind = sessionMode === 'onboard' ? 'kanji2kana' : pickKind(sessionDeck, cur.box);
  // 한자 표기가 없는 단어: 의성어(ぺこぺこ)는 카타카나로 제시해 받아쓰고,
  // 그 외 히라가나 단어(あるいは 등)는 답이 그대로 보이므로 종전대로 뜻→쓰기로 대체
  if (curKind === 'kanji2kana' && cur.it.kanji === cur.it.kana && !isMimetic(cur.it.kana))
    curKind = 'ko2kana';
  renderQuiz();
}

/* 의성어·의태어(ぺこぺこ처럼 같은 소리가 반복되는 말)는 실제로 카타카나로도 자주 쓴다.
   → 카타카나로 제시하고 히라가나로 받아쓰게 한다. (あるいは 같은 일반 히라가나 단어는 해당 없음) */
const toKata = s => s.replace(/[ぁ-ゖ]/g, c => String.fromCharCode(c.charCodeAt(0) + 0x60));
const isMimetic = s => s.length >= 4 && s.length % 2 === 0
  && s.slice(0, s.length / 2) === s.slice(s.length / 2);

/* 문제 유형별 정의 */
function qSpec() {
  const it = cur.it;
  const mimetic = it.kanji === it.kana;   // 여기까지 온 무한자 단어는 의성어뿐 (nextQ에서 걸러짐)
  switch (curKind) {
    case 'ko2kana':    return { label:'이 뜻의 단어를 히라가나로 써보세요', prompt: it.ko,    big:false, type:'write',  answer: it.kana, audio: it.kana };
    case 'kanji2kana': return { label: mimetic ? '이 단어를 히라가나로 써보세요' : '이 단어의 읽는 법을 로마자로 써보세요',
                                prompt: mimetic ? toKata(it.kanji) : it.kanji, big:false, type:'write', answer: it.kana, audio: it.kana };
    case 'kana2ko':    return { label:'이 단어의 뜻은?',                     prompt: it.kanji, big:false, type:'choose', answer: it.ko,   field:'ko',  audio: it.kana,
                                hintKana: it.kanji !== it.kana ? it.kana : '' };   // 한자를 크게, 읽기는 아래 작게
    case 'kanji2ko':   return { label:'이 한자의 뜻은?',                     prompt: it.ch,    big:true,  type:'choose', answer: it.ko,   field:'ko',  audio: it.exKana };
    case 'ko2kanji':   return { label:'이 뜻의 한자는?',                     prompt: it.ko,    big:false, type:'choose', answer: it.ch,   field:'ch',  audio: it.exKana };
  }
}

function distractors(field, correct, n = 3) {
  // 오답 노트처럼 레벨이 섞인 세션에서는 문제 항목이 속한 레벨에서 보기를 뽑습니다
  const pool = poolOf((cur && cur.lv) || sessionLevel, sessionDeck);
  const others = shuffle(pool.map(x => x[field]).filter(v => v && v !== correct));
  return [...new Set(others)].slice(0, n);
}

function renderQuiz() {
  const q = qSpec();
  const done = sessionLen - queue.length - 1;

  screen.innerHTML = `
    <div class="card">
      <div class="qbar"><i style="width:${done / sessionLen * 100}%"></i></div>
      <div class="qmeta">
        <span>${({ mistake: '📕 오답 · ' + cur.lv, today: '오늘의 학습', onboard: '첫 학습' })[sessionMode] || sessionLevel} · ${sessionDeck === 'word' ? '단어' : '한자'} · ${done + 1}/${sessionLen}</span>
        <span>⭕ ${right} &nbsp; ❌ ${wrong} &nbsp;<span class="box-tag">상자 ${cur.box}/${MAXBOX}</span>
          <button class="speak" id="speakToggle" title="발음 자동 재생 켜기/끄기">${S.settings.speak ? '🔊' : '🔇'}</button></span>
      </div>

      <p class="qlabel">${q.label}</p>
      <p class="qprompt ${q.big ? 'big' : ''}">${esc(q.prompt)}</p>
      <p class="qmeaning" id="qMeaning"></p>
      <p class="qhint">${q.type !== 'write' && q.hintKana ? esc(q.hintKana) : ''}</p>

      ${q.type === 'write' ? `
        <div class="kana-view empty" id="kanaView">여기에 히라가나가 나타납니다</div>
        <input type="text" id="answer" autocomplete="off" autocapitalize="off"
               spellcheck="false" placeholder="로마자로 입력 (예: mizu)">
      ` : `
        <div class="opts" id="opts">
          ${shuffle([q.answer, ...distractors(q.field, q.answer)])
            .map(o => `<button class="opt" data-v="${esc(o)}">${esc(o)}</button>`).join('')}
        </div>
      `}

      <div class="feedback" id="feedback"></div>
      <div id="kanjiDetail"></div>

      <div class="row">
        <button id="mainBtn" ${q.type === 'choose' ? 'style="display:none"' : ''}>확인</button>
        <button class="ghost narrow" id="skipBtn">모르겠어요</button>
        <button class="ghost narrow" id="homeBtn">그만</button>
      </div>
    </div>
  `;

  window.scrollTo(0, 0);   // 새 문제마다 화면 맨 위로 (모바일에서 스크롤 잔상 방지)

  // 발음 자동 재생 토글 (온보딩 포함 어느 세션에서든 바로 끄고 켜기)
  const spkToggle = document.getElementById('speakToggle');
  spkToggle.onclick = () => {
    S.settings.speak = !S.settings.speak; save();
    spkToggle.textContent = S.settings.speak ? '🔊' : '🔇';
    if (!S.settings.speak && 'speechSynthesis' in window) speechSynthesis.cancel();
  };

  if (q.type === 'write') {
    const input = document.getElementById('answer');
    const view  = document.getElementById('kanaView');
    input.oninput = () => {
      const k = toKana(input.value);
      view.textContent = k || '여기에 히라가나가 나타납니다';
      view.className = 'kana-view' + (k ? '' : ' empty');
    };
    input.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); checked ? nextQ() : grade(input.value, false); } };
    input.focus();
    // 모바일: 키보드가 올라온 뒤 입력칸이 가려지지 않게 가운데로 스크롤
    setTimeout(() => { try { input.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (e) {} }, 250);
    document.getElementById('mainBtn').onclick = () => checked ? nextQ() : grade(input.value, false);
  } else {
    screen.querySelectorAll('.opt').forEach(b => b.onclick = () => { if (!checked) grade(b.dataset.v, false, b); });
    document.getElementById('mainBtn').onclick = nextQ;
  }

  document.getElementById('skipBtn').onclick = () => { if (!checked) grade('', true); };
  document.getElementById('homeBtn').onclick = () => {
    if (sessionMode !== 'onboard') track('session_quit');   // 세션 중도 이탈 (온보딩은 퍼널로 측정)
    renderHome();
  };
  paintFoot(q.type);
}

function grade(raw, gaveUp, btn) {
  const q = qSpec(), it = cur.it;
  const given = q.type === 'write' ? toKana(raw, true) : raw;
  const correct = !gaveUp && given === q.answer;

  checked = true;
  // 온보딩 첫 세션은 맛보기 — SRS·일일 집계·오답 노트에 아무 기록도 남기지 않음
  if (sessionMode !== 'onboard') recordAnswer(correct, applyResult(cur.id, correct));

  if (correct) right++;
  else { wrong++; missed.push(it); queue.splice(Math.min(3, queue.length), 0, cur); }

  const fb = document.getElementById('feedback');
  // 채점되는 순간, 문제에서 숨겨져 있던 답을 문제 바로 아래 강조 배지로 표시
  //  - 문제가 단어/한자 → 뜻을 (틀렸으면 읽기도 함께)
  //  - 문제가 뜻      → 답(단어/한자)을
  const qm = document.getElementById('qMeaning');
  if (qm) {
    qm.textContent =
      curKind === 'ko2kana'    ? it.kana
      : curKind === 'ko2kanji' ? it.ch
      : curKind === 'kanji2kana' ? (correct ? it.ko : `${it.kana} · ${it.ko}`)
      : it.ko;
    qm.classList.add('show');
  }
  const detail = sessionDeck === 'word'
    ? ''
    : `음독 ${esc(it.on)} · 훈독 ${esc(it.kun)} · 예) ${esc(it.ex)}（${esc(it.exKana)}）`;
  const speakBtn = `<button class="speak" id="speakBtn" ${canSpeak() ? '' : 'disabled title="일본어 음성이 없습니다"'}>🔊</button>`;

  if (q.type === 'write') {
    const view = document.getElementById('kanaView');
    const input = document.getElementById('answer');
    input.disabled = true;
    view.className = 'kana-view ' + (correct ? 'right' : 'wrong');
    view.textContent = correct ? it.kana : (given || '(빈칸)');
  } else {
    screen.querySelectorAll('.opt').forEach(b => {
      b.disabled = true;
      if (b.dataset.v === q.answer) b.classList.add('is-right');
      else if (b === btn) b.classList.add('is-wrong');
    });
    document.getElementById('mainBtn').style.display = '';
  }

  fb.className = 'feedback ' + (correct ? 'right' : 'wrong');
  fb.innerHTML = correct
    ? `<span class="verdict">⭕ 정답!</span> ${speakBtn}${detail ? `<br><span class="extra">${detail}</span>` : ''}`
    : `<span class="verdict">❌${gaveUp ? '' : ' 아쉬워요'}</span> ${speakBtn}<br>
       <span class="extra">${detail ? detail + ' — ' : ''}조금 뒤에 다시 나옵니다</span>`;

  const sb = document.getElementById('speakBtn');
  if (sb) sb.onclick = () => { track('speak_play'); speak(q.audio); };
  if (correct && S.settings.speak) speak(q.audio);

  // 한자 상세 — 단어 덱에서 채점 후에만 (채점 전엔 음독이 답을 누설하므로)
  const kd = document.getElementById('kanjiDetail');
  if (kd && sessionDeck === 'word') {
    const chars = [...new Set([...it.kanji].filter(c => c >= '一' && c <= '鿿'))];
    const infos = chars.map(kanjiInfo).filter(Boolean);
    if (infos.length) {
      const label = open => `⭐ 이 단어의 한자 상세 뜻 ${open ? '▴' : '▾'}`;
      kd.innerHTML = `
        <button class="kd-btn" id="kdBtn">${label(false)}</button>
        <div class="kd-panel" id="kdPanel" style="display:none">
          ${infos.map(k => `
          <div class="kd-row">
            <div class="kd-ch">${esc(k.ch)}</div>
            <div class="kd-info">
              <div><span class="box-tag">${k.lv}</span> <b>${esc(k.ko)}</b></div>
              <div class="extra">음독 ${esc(k.on)} · 훈독 ${esc(k.kun)}</div>
              <div class="extra">예) ${esc(k.ex)}（${esc(k.exKana)}）</div>
            </div>
          </div>`).join('')}
        </div>`;
      document.getElementById('kdBtn').onclick = () => {
        const p = document.getElementById('kdPanel');
        const opening = p.style.display === 'none';
        p.style.display = opening ? 'block' : 'none';
        document.getElementById('kdBtn').textContent = label(opening);
        // 단어별로 기록 → "사용자들이 가장 많이 들춰보는(=헷갈려하는) 단어" 랭킹이 됨
        if (opening) track('kanji_detail_open/' + it.kanji);
      };
    }
  }

  const main = document.getElementById('mainBtn');
  main.textContent = '다음 →';
  document.getElementById('skipBtn').style.display = 'none';
  main.focus();
}

/* ---------- 결과 ---------- */
function renderDone() {
  if (sessionMode === 'onboard') { S.onboarded = true; save(); track('onboard_done', true); }   // 첫 세션 완료 = 온보딩 끝
  else track('session_complete');
  const total = right + wrong;
  const pct = total ? Math.round(right / total * 100) : 0;
  const uniq = [...new Map(missed.map(w => [w.kana || w.ch, w])).values()];
  const st = statsOf(sessionLevel, sessionDeck);
  const t = todayStat(), goal = S.settings.dailyGoal;
  const labels = { mistake: '📕 오답 노트', today: '오늘의 학습', onboard: '첫 학습' };

  screen.innerHTML = `
    <div class="card done">
      <h2>${sessionMode === 'onboard' ? '방금 5개 단어를 직접 써서 외웠어요 ✍️' : 'おつかれさま！ 🎉'}</h2>
      <p class="extra">${labels[sessionMode] || sessionLevel} ${sessionDeck === 'word' ? '단어' : '한자'} ${sessionLen}문항 완료</p>
      <p class="score">${pct}%</p>
      <p class="extra">한 번에 맞힌 비율 · 총 ${total}번 시도</p>
      ${sessionMode === 'onboard' ? '' : `
      <p class="extra" style="margin-top:10px">
        오늘 <b>${t.n}</b>/${goal}문항${t.n >= goal ? ' · <b style="color:var(--ok)">목표 달성!</b> 🔥 ' + streakNow() + '일째' : ' — 목표까지 <b>' + (goal - t.n) + '문항</b> 남았어요'}
      </p>
      <p class="extra">
        이 레벨 진도 — 익힘 <b>${st.learned}</b> / 학습중 ${st.learning} / 아직 안 본 것 ${st.fresh}
      </p>`}

      ${uniq.length ? `
        <div class="missed">
          ${sessionMode === 'onboard' ? '' : `<h2>한 번이라도 틀린 ${uniq.length}개 — 상자가 내려가서 곧 다시 나옵니다</h2>`}
          <ul>${uniq.map(w => `<li>
              <span><b>${esc(w.kana || w.ch)}</b> ${esc(w.kanji || '')}</span>
              <span class="extra">${esc(w.ko)}
                <button class="speak" data-say="${esc(w.kana || w.exKana)}" ${canSpeak()?'':'disabled'}>🔊</button>
              </span></li>`).join('')}</ul>
        </div>` : '<p class="extra" style="margin-top:14px">전부 한 번에 맞히셨어요 👏</p>'}

      <div class="row">
        ${sessionMode === 'onboard'
          ? '<button id="homeBtn2">시작할 준비 완료 — 홈으로 →</button>'
          : `<button id="againBtn">${
              sessionMode === 'mistake' ? '오답 한 세션 더'
              : sessionMode === 'today' ? (t.n >= goal ? '한 세션 더' : '이어서 목표 채우기 →')
              : '이어서 한 세션 더'}</button>
        <button class="ghost narrow" id="homeBtn2">홈으로</button>`}
      </div>
    </div>
  `;
  window.scrollTo(0, 0);
  screen.querySelectorAll('[data-say]').forEach(b => b.onclick = () => { track('speak_play'); speak(b.dataset.say); });
  const againBtn = document.getElementById('againBtn');
  if (againBtn) againBtn.onclick = () =>
    sessionMode === 'mistake' ? startMistakeSession()
    : sessionMode === 'today' ? startTodaySession()
    : startSession();
  document.getElementById('homeBtn2').onclick = renderHome;
  paintFoot('home');
}

            <span class="extra">${esc(m.it.ko)} · <span class="warn">❌${m.w}</span> 상자${m.box}

/* ---------- 단어 가져오기 ---------- */
function renderImport() {
  const { level, deck } = S.settings;
  const mine = S.custom[`${level}|${deck}`] || [];
  screen.innerHTML = `
    <div class="card">
      <h2>${level} · ${deck === 'word' ? '단어' : '한자'} 가져오기</h2>
      <p class="note">
        한 줄에 하나씩, <b>쉼표(,) 또는 탭</b>으로 구분해서 붙여넣으세요.<br>
        ${deck === 'word'
          ? '형식: <code>히라가나, 한자, 뜻</code> &nbsp;→&nbsp; 예) <code>みず, 水, 물</code>'
          : '형식: <code>한자, 음독, 훈독, 뜻, 예시단어, 예시읽기</code> &nbsp;→&nbsp; 예) <code>水, スイ, みず, 물 수, 水曜日, すいようび</code>'}<br>
        JLPT 단어 목록을 스프레드시트에서 복사해 그대로 붙여넣으면 됩니다.
        현재 이 덱에 직접 추가한 항목: <b>${mine.length}개</b>
      </p>
      <textarea id="ta" placeholder="${deck === 'word' ? 'みず, 水, 물\nひと, 人, 사람' : '水, スイ, みず, 물 수, 水曜日, すいようび'}"></textarea>
      <div class="row">
        <button id="addBtn">추가하기</button>
        <button class="ghost narrow" id="clearBtn">추가분 비우기</button>
        <button class="ghost narrow" id="backBtn">← 홈</button>
      </div>
      <p class="note" id="importMsg" style="margin-top:12px"></p>
    </div>`;

  document.getElementById('addBtn').onclick = () => {
    const lines = document.getElementById('ta').value.split('\n').map(l => l.trim()).filter(Boolean);
    const need = deck === 'word' ? 3 : 6;
    const rows = [], bad = [];
    for (const line of lines) {
      const p = line.split(/[\t,，]/).map(x => x.trim());
      if (p.length < need || p.some(x => !x)) { bad.push(line); continue; }
      rows.push(deck === 'word'
        ? { kana:p[0], kanji:p[1], ko:p[2] }
        : { ch:p[0], on:p[1], kun:p[2], ko:p[3], ex:p[4], exKana:p[5] });
    }
    const key = `${level}|${deck}`;
    const exist = new Set(poolOf(level, deck).map(x => x.kana || x.ch));
    const fresh = rows.filter(r => !exist.has(r.kana || r.ch));
    S.custom[key] = [...(S.custom[key] || []), ...fresh];
    save();
    if (fresh.length) track('import_words');   // 커스텀 단어 기능 수요
    document.getElementById('importMsg').innerHTML =
      `✅ <b>${fresh.length}개</b> 추가했어요.` +
      (rows.length - fresh.length ? ` (중복 ${rows.length - fresh.length}개 건너뜀)` : '') +
      (bad.length ? ` <span class="warn">형식이 안 맞는 ${bad.length}줄은 무시했습니다.</span>` : '');
    document.getElementById('ta').value = '';
  };
  document.getElementById('clearBtn').onclick = () => {
    if (confirm(`${level} ${deck === 'word' ? '단어' : '한자'}에 직접 추가한 항목을 모두 지웁니다. 계속할까요?`)) {
      delete S.custom[`${level}|${deck}`]; save(); renderImport();
    }
  };
  document.getElementById('backBtn').onclick = renderFree;
  paintFoot('import');
}

/* ---------- 하단 안내 ---------- */
function paintFoot(mode) {
  if (mode) footMode = mode;
  const f = document.getElementById('foot');
  if (!f) return;
  const voice = canSpeak() ? '' :
    '<br><span class="warn">발음 듣기: 이 브라우저에 일본어 음성이 없습니다. Chrome/Edge에서 열거나 Windows 설정 → 시간 및 언어 → 음성에서 일본어 음성을 추가해 보세요.</span>';
  f.innerHTML = ({
    write : `로마자로 치면 히라가나로 바뀝니다. <kbd>Enter</kbd> 로 확인 / 다음<br>예) mizu → みず · gakkou → がっこう · shashin → しゃしん${voice}`,
    choose: `보기를 눌러서 답하세요. <kbd>Enter</kbd> 로 다음 문제${voice}`,
    import: `추가한 단어는 이 브라우저에만 저장됩니다.`,
    mistake: `오답 노트는 현재 선택된 덱(단어/한자) 기준이에요. 자유 학습에서 덱을 바꾸면 그 덱의 오답이 보입니다.`,
    free  : `자유 학습은 레벨·덱·방식을 직접 골라서 공부하는 곳이에요. 여기서 푼 문항도 오늘 목표에 들어갑니다.`,
    onboard: `가입 없음 · 기록은 이 기기의 브라우저에 저장됩니다.<br>📱 <b>아이폰은 Safari</b>, <b>안드로이드는 Chrome</b>으로 열어 주세요 — 카톡·인스타 안에서 열면 기록이 따로 저장되고 홈 화면 추가도 안 돼요.`,
    home  : `학습 기록은 이 브라우저에 자동 저장됩니다 — 창을 닫았다 열어도 이어서 진행돼요.${voice}`
  })[footMode] || '';
}

/* ── 시작 ── */
if (!S.anonId) { S.anonId = Math.random().toString(36).slice(2, 10); save(); }
/* 유입 채널: 홍보 링크의 ?from=cafe 같은 값을 첫 방문 때 한 번만 기록(first-touch).
   이미 값이 있으면 덮어쓰지 않는다 — 처음 데려온 채널의 성과로 계속 귀속시키기 위함 */
if (!S.channel) {
  const q = new URLSearchParams(location.search);
  const raw = (q.get('from') || q.get('utm_source') || '').toLowerCase();
  const ch = raw.replace(/[^a-z0-9-]/g, '').slice(0, 16);
  if (ch) { S.channel = ch; save(); }
}
// 실행 환경 구분: PWA(홈 화면 설치) vs 일반 브라우저 → 설치율 측정
const isPWA = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
track(isPWA ? 'visit_pwa' : 'visit_browser');
// 일일 방문(DAU): 기기당 하루에 딱 한 번만 전송 → "중복 없는 그날의 방문 기기 수"
if (S.lastDailyVisit !== dstr()) { S.lastDailyVisit = dstr(); save(); track('visit_daily', true); }
// 리텐션(D1/D7/D30): 서버 없이 각 기기가 스스로 "첫 사용 후 며칠째"를 계산해서
// 정확히 1·7·30일째 되는 날 다시 열면 한 번만 신호를 보냄 (기존 사용자는 학습 기록에서 첫날 소급)
if (!S.firstDay) {
  const days = Object.keys(S.stats.daily).sort();
  S.firstDay = days[0] || dstr(); save();
}
const sinceDays = Math.round((new Date(dstr() + 'T00:00:00') - new Date(S.firstDay + 'T00:00:00')) / DAY);
for (const n of [1, 7, 30]) {
  if (sinceDays === n && !S.ret['d' + n]) { S.ret['d' + n] = 1; save(); track('return_d' + n, true); }
}
// 실사용 중 JS 오류 감지 (로드당 1회만 — 스팸 방지)
let errTracked = false;
window.addEventListener('error', () => { if (!errTracked) { errTracked = true; track('error_js'); } });
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});   // PWA (배포 환경에서만)
}
S.onboarded ? renderHome() : renderOnboarding();
</script>
</body>
